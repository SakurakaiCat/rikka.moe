          - heading "有限责任与自由生活" [level=1] [ref=e28]
          - paragraph [ref=e29]: 关于亲人的期待、有限责任，以及一个十九岁的人对自由生活的想象。
        - figure [ref=e30]:
          - img "有限责任与自由生活" [ref=e31]
      - generic [ref=e32]:
        - navigation "目录" [ref=e33]:
          - strong [ref=e34]: 目录
        - generic [ref=e35]:
          - generic [ref=e36]:
            - generic [ref=e37]: AI总结
            - text: 作者写下十九岁这年的核心矛盾：**一边是亲人把希望与责任压上来——失业的父亲、打零工的母亲、靠资助换将来扶持的远亲；另一边是他只想做一个「闲散人」，自由自在地活着。** 文章罗列了几位接济者各自的窘迫，承认他们的善意里掺着对未来回报的指望；坦承自己想要的不过是一间出租屋、一盏台灯、凌晨听雨的那种舒适感。在「自由」一节里，他追溯高考特意填了一个坐飞机要几小时的远方城市，是想离原来的牢笼远一点；在「恋爱」一节里，又说自己更愿意独处、不思乡、不擅回应。结论很轻：*重要的不是回到哪里，而是能否自由地活着、听见自己的内心，并在不被打扰的生活里，获得些许舒适。*
            - generic [ref=e38]: 由 DeepSeek V4 Pro 驱动总结
          - paragraph [ref=e39]: 我的人生，目下最大的矛盾，约略就是两桩：一桩是亲人把希望和责任，一并放在我肩上；一桩是我自己却只想做一个闲散人，自由自在，随心所欲，最好连明日也不必太认真。
          - paragraph [ref=e40]: 说来可笑，我如今每月不过几百块生活费，竟也还不断有人接济。亲人之中，有的定期却也给我发点红包。且若他们家道丰足，倒也罢了；偏偏并非如此。有的经商失败，债务缠身，日日同征信斗智斗勇，切换各种支付宝和微信；有的则炒股失利，被套其中，进退不得。总之，都不是宽裕人，却还从自己的窘迫里，分出一点来给我。
          - paragraph [ref=e41]: 与我联系频繁的，大抵也只有一人。
          - paragraph [ref=e42]: 早年也曾有亲戚资助过我，但这一位，既与我较亲，境况又不佳，偏偏资助最多。我对她的感情，也颇有些特别。从小到大，见得多，牵连也深。她中年时嫁了一个丈夫，亦不甚可靠；两人生了一个女儿，后来终究闹散了。据说男的境况不好，她也好不到哪里去。于是孩子归了她，婚也离了。
          - paragraph [ref=e43]: 那女孩如今上初中，我倒也觉得她受的创伤比我从小到大多得多，其实，我对她的未来也不抱什么希望。而她所以资助我，先前也资助过我哥，未必全是无所求的仁慈。说到底，不过是盼着我将来能扶她孩子一把。说白了，为她照顾后事。
          - paragraph [ref=e44]: 之前过年时，又有另一亲戚，跑过来告诉我，要肩负起责任，「毕竟你爸都失业了，你妈靠打零工为生」，境况不太好，叫我多去外面打工兼职，赚点零花钱。我当时也不知道回些什么，却也只能不停说好。
          - paragraph [ref=e45]: 以后的生活，我更想自由自在，且不说过得多好。
          - paragraph [ref=e46]: 若有一间大小无所谓的出租屋：一张床、电脑、手机、耳机、摆张小桌子，然后有间小洗浴间，最好有扇窗，能让我于凌晨时分戴着耳机在台灯传来的微光下，往向窗外的风景。我高中放假的时候，就喜欢在我的小房间里，在凌晨时分，于台灯下，看着电纸书，窗外还在下雨。这也是为何那么喜欢这种舒适感。
          - paragraph [ref=e47]: 这或许有点逃避现实，但我今年十九岁了，算是成人了，也该梦想自己未来的生活了。我倒是希望能和我的家族减少联系，保持有限责任，毕竟我的存在感本来也不太高，且我们家族里也不乏比我厉害之辈了，我能和上海交大又去香港深造的人比吗。
          - paragraph [ref=e48]: 追求自由，从我高中就开始了，高中我如此努力，除了肩上负着来自教师和亲人的期望外，还有我内心对未来是有希望变好的美好愿景。因而，在高考志愿上，我填了一个坐飞机都需要几个小时的地方，而非湖南、四川与广东，因为我想去一个离原本，困住我的牢笼更远点的地方。尽管意味着真正意义上的自己生活，但我相信这些适应的代价值得，只需自立一点就好了。
          - paragraph [ref=e49]: 近来又令我烦扰的一桩，是他们时常暗示我该谈恋爱，也该打扮得好看些。
          - paragraph [ref=e50]: 我并非没有过爱情，也并非没有谈过恋爱。甚至曾有人主动来追我。只是尴尬之处在于，我不知道该如何回应，最后反倒让对方失望了。那还是中学时期的事。彼时评价人大抵以成绩为主，而我又算是最优秀的那批，性格还算温和，没什么坏习惯，有人喜欢我，倒也自然。我也知道谁喜欢我，知道自己喜欢谁，只是终究因为软弱，没能成事。
          - paragraph [ref=e51]: 不过，那也算给我留下了一点好的回忆吧。
          - paragraph [ref=e52]: 至于如今，我似乎还是更喜欢一个人独处、享受。我对我的家乡，也谈不上什么感情。别人是思乡，我倒常常无所谓。于我而言，重要的不是回到哪里，而是能否自由地活着，能否开心一点，能否感到自己的存在，听见自己的内心，并在一种不被打扰的生活里，获得些许舒适。
          - paragraph [ref=e53]: 如此而已。
