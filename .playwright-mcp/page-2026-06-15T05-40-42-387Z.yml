          - heading "8. Converting Physical SIM to eSIM" [level=2] [ref=e379]
          - paragraph [ref=e380]: Giffgaff launched eSIM support in 2023, and after two years of iteration, physical-to-eSIM conversion and eSIM device transfers through the official app are now smooth.
          - heading "Prerequisites" [level=3] [ref=e381]
          - list [ref=e382]:
            - listitem [ref=e383]: Phone must support eSIM — China-market phones don’t support eSIM regardless of brand. US, Japanese, or European versions are required
            - listitem [ref=e384]: You must have an already-activated giffgaff physical card — eSIMs can’t generate a number from scratch; they must be converted from a physical card
            - listitem [ref=e385]: A stable proxy environment throughout; system-wide mode recommended with a UK or US node
          - heading "Conversion Steps" [level=3] [ref=e386]
          - paragraph [ref=e387]: The old physical card becomes invalid immediately during conversion, so ensure a stable network before starting and back up important data in advance.
          - list [ref=e388]:
            - listitem [ref=e389]: Download the latest giffgaff app, log in, tap Account → SIM
            - listitem [ref=e390]: Tap Replace my SIM → Switch to a new eSIM
            - listitem [ref=e391]:
              - text: Accept the agreement, confirm → tap Install eSIM
              - list [ref=e392]:
                - listitem [ref=e393]: Android phones will directly show the system eSIM installation screen
                - listitem [ref=e394]: iPhone may auto-redirect or provide a QR code or activation code
            - listitem [ref=e395]: Wait for signal recovery. As fast as 30 minutes; at most one day
          - heading "Possible Errors" [level=3] [ref=e396]
          - table [ref=e397]:
            - rowgroup [ref=e398]:
