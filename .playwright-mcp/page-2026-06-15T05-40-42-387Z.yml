            - listitem [ref=e247]: Send a text — the cheapest option, only £0.30 (~¥2.7)
            - listitem [ref=e248]: Make a phone call (must connect)
            - listitem [ref=e249]: Use mobile data, even just 1KB
            - listitem [ref=e250]: Top up your account, minimum £10 (~¥90)
          - paragraph [ref=e251]: "Invalid actions:"
          - list [ref=e252]:
            - listitem [ref=e253]: Logging into the website or app — no balance change, doesn’t count
            - listitem [ref=e254]: Receiving texts only — incoming texts are free, no balance change
            - listitem [ref=e255]: Browsing via WiFi — that goes through WiFi, unrelated to giffgaff balance
          - heading "The Cheapest Number-Keeping Method" [level=3] [ref=e256]
          - paragraph [ref=e257]:
            - text: Every 5 months, manually send one text. To anyone — even your own domestic number. Each text costs £0.30 (
            - deletion [ref=e258]: ¥2.7); twice a year is £0.60 (
            - text: ¥5.4). A £10 (~¥90) top-up can theoretically keep your number alive for 16 years.
          - heading "How to Check Your Number-Keeping Deadline" [level=3] [ref=e259]
          - list [ref=e260]:
            - listitem [ref=e261]:
              - text: Log in at
              - link "giffgaff.com/orders/history" [ref=e262] [cursor=pointer]:
                - /url: https://www.giffgaff.com/orders/history
              - text: ", click View, find the date of your most recent charge or top-up"
            - listitem [ref=e263]: Count forward 170 days from that date (leaving a 10-day buffer), and set a recurring reminder in your phone’s calendar
          - heading "Don’t Be Fooled by the “3 Months Until Expiry” on the Dashboard" [level=3] [ref=e264]
          - paragraph [ref=e265]: The bottom of the official site often shows text like “Free giffgaff to giffgaff calls and texts expire on [date]” — that’s a countdown for the free intra-network calling perk, which has nothing to do with number-keeping. As long as you have balance and activity within 180 days, your number will not be deactivated. That red date is purely a scare tactic.
          - heading "What If You Forget to Keep the Number Active" [level=3] [ref=e266]
          - paragraph [ref=e267]:
            - strong [ref=e268]: Warning period
            - text: ": About a week before the 180-day mark, giffgaff sends a warning email to your registered address. Send a text immediately after seeing it to reset the 180-day clock."
          - paragraph [ref=e269]:
            - strong [ref=e270]: Frozen period
            - text: ": If you exceed 180 days with no activity, the number may already be frozen. Try topping up £10 (~¥90) immediately — if the top-up succeeds, the number can usually be recovered. If the top-up fails, the number has been reclaimed and cannot be recovered."
          - separator [ref=e271]
          - heading "6. Resetting Your Password and Changing Your Email" [level=2] [ref=e272]
          - heading "Resetting Your Password" [level=3] [ref=e273]
          - list [ref=e274]:
            - listitem [ref=e275]:
              - text: Open
              - link "giffgaff.com/auth/login" [ref=e276] [cursor=pointer]:
                - /url: https://www.giffgaff.com/auth/login
              - text: ", click Forgot your password"
            - listitem [ref=e277]: Select the Phone number method, click Next
            - listitem [ref=e278]: Enter your number using the UK domestic format starting with 07 (e.g., 07547123456)
            - listitem [ref=e279]:
              - text: Don’t know your number? Send a text with
              - code [ref=e280]: NUMBER
              - text: to
              - code [ref=e281]: "43430"
              - text: from the phone with the card inserted — you’ll get a reply in seconds
            - listitem [ref=e282]: Select Text message verification, click Send a reset link
            - listitem [ref=e283]: Click the link in the text and set a new password
          - heading "Changing Your Registered Email" [level=3] [ref=e284]
          - paragraph [ref=e285]: Giffgaff’s notifications — low balance, roaming alerts, password resets — all go to your email. It’s a good idea to link one of your commonly used domestic email addresses.
          - list [ref=e286]:
            - listitem [ref=e287]:
              - text: Log in at
              - link "giffgaff.com/profile/details" [ref=e288] [cursor=pointer]:
                - /url: https://www.giffgaff.com/profile/details
              - text: ", click Profile and settings"
            - listitem [ref=e289]: In Personal details, find My email, click Open → Change email
            - listitem [ref=e290]: The system asks for your current password to verify your identity — so reset your password first if needed
            - listitem [ref=e291]: Enter your new email address, click Update email
            - listitem [ref=e292]: Go to the new email, retrieve the verification code (6 digits), click Confirm
          - paragraph [ref=e293]: QQ Mail, NetEase 163/126, Alibaba Cloud Mail, and other mainstream Chinese email providers can all receive giffgaff emails. Using a VPN to access the official site is recommended — otherwise the verification code may fail to load.
          - separator [ref=e294]
          - heading "7. Registering for Overseas Apps" [level=2] [ref=e295]
          - paragraph [ref=e296]: Giffgaff is a native UK physical number with a high success rate for registering overseas services. As long as your network environment isn’t flagged, the vast majority of overseas apps can be registered smoothly.
          - heading "Number Format Rules" [level=3] [ref=e297]
          - paragraph [ref=e298]: Regardless of which app you register, select United Kingdom (+44) as the country/region, and enter 10 digits in the number field — drop the leading 0. For example, if your number is 07547123456, enter 7547123456 in the app.
          - heading "Troublesome Apps" [level=3] [ref=e299]
          - paragraph [ref=e300]:
            - strong [ref=e301]: Telegram
          - paragraph [ref=e302]: "Not receiving verification codes and “too many attempts” messages are common issues. Key points: first-time registration must be done via the mobile app, not desktop or web; don’t switch proxy nodes frequently; many China-market Android phones have GMS (Google Mobile Services) stripped out, and Telegram sometimes delivers codes through Google’s channel — use an iPhone or an Android phone with full GMS installed for more reliable results."
          - paragraph [ref=e303]:
            - strong [ref=e304]: LINE
          - paragraph [ref=e305]:
            - text: "LINE has extremely strict risk controls with high demands on IP purity; ordinary proxy nodes are often flagged as risky. If you can’t receive a code through any proxy node, try briefly enabling giffgaff’s data roaming to register using native UK data — but be quick: first disable network access for all background apps (keep only LINE), then enable data roaming and tap send verification code, and immediately turn off data roaming once the code arrives. Roaming data is £0.20/MB ("
            - deletion [ref=e306]: ¥1.8/MB); if background apps aren’t blocked, several pounds (
            - text: ¥9+) can be deducted in seconds.
          - paragraph [ref=e307]:
            - strong [ref=e308]: TikTok
          - paragraph [ref=e309]: "Easily identified as a Chinese user. Solution: insert only the giffgaff card, remove your domestic China Mobile/Unicom/Telecom card; set phone language to English and timezone to London; avoid Hong Kong and Taiwan proxy nodes — use US, Singapore, or UK nodes."
          - paragraph [ref=e310]:
            - strong [ref=e311]: WeChat Account Transfer
          - paragraph [ref=e312]: In theory you can rebind a domestic WeChat account to a giffgaff number, but after rebinding the account migrates to the international server — health code, facial recognition and similar interfaces may break, and RMB wallet and financial features become unusable. Don’t attempt this unless you fully understand the consequences.
