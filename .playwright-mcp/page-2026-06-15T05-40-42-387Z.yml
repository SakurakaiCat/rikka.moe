          - heading "Foreword" [level=2] [ref=e100]
          - paragraph [ref=e101]: To register for overseas services like ChatGPT, WhatsApp, or Telegram from within China, you need a foreign phone number to receive verification codes. Google Voice is expensive and prone to reclamation; virtual code-receiving platforms tighten their risk controls year after year. After weighing the options, a physical giffgaff SIM card from the UK is probably the most cost-effective path — no ID required, no monthly fees, incoming texts are completely free, and keeping a number alive for a year costs only about five yuan.
          - paragraph [ref=e102]: This article covers activation, top-up, number-keeping, tariffs, registering overseas apps, switching to eSIM, and changing your number.
          - separator [ref=e103]
          - heading "1. What Is giffgaff?" [level=2] [ref=e104]
          - paragraph [ref=e105]: giffgaff is a UK low-cost mobile virtual network operator riding on O2, one of the UK’s three major carriers. Founded in 2009, it has no physical stores and no phone-based customer service — everything runs through the website and app. Operating costs are squeezed low, and so is the price for users.
          - paragraph [ref=e106]:
            - img "giffgaff Introduction and Features" [ref=e107]
          - heading "Why Choose It" [level=3] [ref=e108]
          - list [ref=e109]:
            - listitem [ref=e110]: Issues a real UK physical number, not a virtual number range — regarded as “clean” by major platforms
            - listitem [ref=e111]: Supports eSIM; devices from 2021 onwards can self-convert in the official app
            - listitem [ref=e112]: Supports WiFi Calling (calling and texting over WiFi instead of cellular; available natively in the UK; can be enabled domestically with a UK IP or routing rules, but requires being physically in the UK)
            - listitem [ref=e113]: Choose Pay as you go — zero monthly fees, no fixed charges whatsoever
            - listitem [ref=e114]: No ID required; just fill in any non-duplicate Chinese pinyin address when topping up with official vouchers
            - listitem [ref=e115]: "Incoming texts are completely free — this is the card’s primary use case in China: receiving verification codes at zero cost"
            - listitem [ref=e116]: Roaming works in China on China Mobile or China Unicom towers
            - listitem [ref=e117]: "Number-keeping cost is extremely low: send one text every six months to trigger a balance change; a £10 (~¥90) top-up can theoretically keep the number alive for 25 years"
          - heading "Blank Cards vs Pre-loaded Cards" [level=3] [ref=e118]
          - paragraph [ref=e119]: "Giffgaff cards available on the market come in two types:"
          - table [ref=e120]:
            - rowgroup [ref=e121]:
              - row "Card Type Description" [ref=e122]:
                - columnheader "Card Type" [ref=e123]
                - columnheader "Description" [ref=e124]
            - rowgroup [ref=e125]:
              - row "Blank card A brand-new unactivated card with no balance and no phone number. You must top up at least £10 (~¥90) with a VISA or MasterCard to activate it" [ref=e126]:
                - cell "Blank card" [ref=e127]
                - cell "A brand-new unactivated card with no balance and no phone number. You must top up at least £10 (~¥90) with a VISA or MasterCard to activate it" [ref=e128]
              - row "Pre-loaded card The seller tops up £15 (~¥135) and activates it on the day of purchase. Insert the card and use it directly — no personal information required" [ref=e129]:
                - cell "Pre-loaded card" [ref=e130]
                - cell "The seller tops up £15 (~¥135) and activates it on the day of purchase. Insert the card and use it directly — no personal information required" [ref=e131]
          - paragraph [ref=e132]:
            - img "Blank Card vs Pre-loaded Card" [ref=e133]
          - separator [ref=e134]
          - heading "2. Activation and Top-up" [level=2] [ref=e135]
          - paragraph [ref=e136]: Strictly follow local laws and regulations. Do not use this card for telecom fraud or spam messaging — you bear all consequences.
          - heading "What to Prepare Before Activation" [level=3] [ref=e137]
          - list [ref=e138]:
            - listitem [ref=e139]: A giffgaff SIM card with a 6-digit Activation Code printed on it
            - listitem [ref=e140]: A credit or debit card with a VISA or MasterCard logo — UnionPay, JCB, and American Express are not accepted
            - listitem [ref=e141]: Never use a virtual credit card. It may occasionally succeed, but easily triggers risk controls; if the card is locked and funds frozen, the loss far outweighs the gain
            - listitem [ref=e142]: At least £10 in top-up budget
          - paragraph [ref=e143]: If you don’t have a suitable foreign-currency card, you can use an activation proxy service.
          - heading "Activation Process" [level=3] [ref=e144]
          - paragraph [ref=e145]: "The logic is simple: top up £10 (~¥90), the system assigns you a random UK phone number, insert the card and you’re good to go."
          - list [ref=e146]:
            - listitem [ref=e147]:
              - text: Open
              - link "giffgaff.com/activate" [ref=e148] [cursor=pointer]:
                - /url: https://www.giffgaff.com/activate
              - text: ", enter the 6-digit code from your card, click Activate your SIM"
            - listitem [ref=e149]: Enter your email, set a password, click Register
            - listitem [ref=e150]: "Choose a plan — this step is critical: the page pushes a bunch of monthly plans. Ignore them, scroll to the bottom to find Pay as you go (pay-per-use, no monthly fee), select it and click Continue"
            - listitem [ref=e151]: Select £10 (~¥90) as the top-up amount — this is the minimum activation threshold — click Pay now
            - listitem [ref=e152]: "Fill in personal info: name in pinyin is fine; for the address, select China as the country so you don’t need to verify a UK address; just write your domestic address in pinyin in the street field"
            - listitem [ref=e153]: Enter your card details, tick the agreement box, click Place order. Some banks will redirect to a 3DS verification page — just wait for it to load
            - listitem [ref=e154]: After payment, the page shows your assigned UK number and balance. If you see “extra £5 credit,” the new-user bonus has also arrived
          - paragraph [ref=e155]:
            - img "Activation Steps Screenshot" [ref=e156]
          - paragraph [ref=e157]: After activation, wait for a signal — usually less than an hour, but it can take up to a day. When your phone picks up a China Mobile or China Unicom signal after inserting the card, activation is confirmed.
          - separator [ref=e158]
          - heading "3. Mainland China Roaming Tariffs" [level=2] [ref=e159]
