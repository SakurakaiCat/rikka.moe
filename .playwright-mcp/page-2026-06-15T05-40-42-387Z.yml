          - paragraph [ref=e459]: "When buying, confirm two things: whether it supports eSIM, and whether it’s carrier-unlocked. Locked phones with turbo SIMs are extremely problematic or unusable with eSIM. On Xianyu or Taobao, include version keywords in your search, e.g., “iPhone SE3 US version unlocked.”"
          - separator [ref=e460]
          - heading "9. Changing Your Number" [level=2] [ref=e461]
          - paragraph [ref=e462]: "Giffgaff numbers are randomly assigned upon activation and cannot be chosen. You might encounter two issues: the number has too many “4”s (which feels unlucky), or the previous owner of the number abused it, causing WhatsApp or Telegram to report the number as already registered. Giffgaff gives each account two number-change opportunities, usually free."
          - heading "Before Changing" [level=3] [ref=e463]
          - list [ref=e464]:
            - listitem [ref=e465]: The card must be activated
            - listitem [ref=e466]: You must know your account password
            - listitem [ref=e467]: A system-wide proxy is recommended
            - listitem [ref=e468]: Number changes are irreversible — the old number is immediately voided and cannot be recovered
            - listitem [ref=e469]: The new number is still randomly assigned, though in practice second-time assignments tend to be better
            - listitem [ref=e470]: Signal will be lost during the change — as short as 30 minutes, as long as 4 hours
          - heading "Steps" [level=3] [ref=e471]
          - list [ref=e472]:
            - listitem [ref=e473]:
              - text: Log in at
              - link "giffgaff.com/profile/details/getnumber" [ref=e474] [cursor=pointer]:
                - /url: https://www.giffgaff.com/profile/details/getnumber
            - listitem [ref=e475]: Click Get a new giffgaff number
            - listitem [ref=e476]: Enter your password to confirm identity, click Change my number
            - listitem [ref=e477]: The page redirects to show your new number; phone signal will temporarily disappear
            - listitem [ref=e478]: Turn the phone off, wait 30 minutes, then turn it back on. Or restart/toggle airplane mode once per hour — signal usually recovers within 4 hours
          - heading "After Changing" [level=3] [ref=e479]
          - list [ref=e480]:
            - listitem [ref=e481]: Log out of the giffgaff app and log back in to ensure it displays the new number
            - listitem [ref=e482]: Important services registered with the old number (banks, WeChat, etc.) must be unbound before the change — the change takes effect immediately and the old number is no longer yours
            - listitem [ref=e483]: If you’re still not satisfied with the new number and haven’t used both chances, you can change again, but don’t do it in quick succession — it can trigger risk controls
          - separator [ref=e484]
          - heading "10. Frequently Asked Questions" [level=2] [ref=e485]
          - heading "Number Format" [level=3] [ref=e486]
          - paragraph [ref=e487]:
            - strong [ref=e488]: "Q: Website keeps saying my number format is wrong?"
          - paragraph [ref=e489]: Use the UK domestic format (07 prefix, keep the leading 0, 11 digits total) for logging into the giffgaff website and app. Use the international format (+44 prefix, drop the leading 0) for registering with overseas apps.
          - paragraph [ref=e490]:
            - strong [ref=e491]: "Q: Don’t remember your number?"
          - paragraph [ref=e492]:
            - text: Send a text with
            - code [ref=e493]: NUMBER
            - text: to
            - code [ref=e494]: "43430"
            - text: — you’ll receive a reply in seconds. You can also check on the Dashboard homepage or in the app.
          - paragraph [ref=e495]:
            - strong [ref=e496]: "Q: Is ID verification required?"
          - paragraph [ref=e497]: No. UK prepaid SIMs currently do not require ID registration.
          - heading "Signal and Texting" [level=3] [ref=e498]
          - paragraph [ref=e499]:
            - strong [ref=e500]: "Q: No service after inserting the card?"
          - paragraph [ref=e501]: "On first insertion, the phone uploads data for roaming registration — wait 1 to 5 minutes. If there’s still no signal after a long time, manually select a carrier in phone settings: Mobile Network → Network Selection → turn off Auto → manually select China Mobile or China Unicom. Restarting the phone is the most reliable fix."
          - paragraph [ref=e502]:
            - strong [ref=e503]: "Q: Not receiving app registration verification codes?"
          - paragraph [ref=e504]: Usually not a card issue. Either the proxy node is low-quality or risk-flagged; or the registration method is wrong (e.g., Telegram requires mobile app registration); or an Android RCS channel issue — giffgaff increasingly sends codes via Google RCS, and domestic Android phones without full GMS may not receive them. Install Google Mobile Services or switch the card to an iPhone.
          - paragraph [ref=e505]:
            - strong [ref=e506]: "Q: Can’t send texts or make calls?"
          - paragraph [ref=e507]:
            - text: First check your balance — texts cost £0.30 (
            - deletion [ref=e508]: ¥2.7) each, calls £1/min (
            - text: "¥9). Then check the number format: add +86 before domestic Chinese numbers, add +44 before UK numbers and drop the leading 0. Also, texts to China Mobile numbers may be blocked by the anti-fraud system; Unicom and Telecom numbers have higher success rates."
          - paragraph [ref=e509]:
            - strong [ref=e510]: "Q: Can I use mobile data in China?"
          - paragraph [ref=e511]: Roaming data costs £200/GB, roughly ¥1800. Turning off data roaming is an absolute must — otherwise several pounds can be deducted in seconds.
          - heading "Tariffs and Pitfalls" [level=3] [ref=e512]
          - paragraph [ref=e513]:
            - strong [ref=e514]: "Q: Anything special iPhone users should watch out for?"
          - paragraph [ref=e515]: After inserting the card, iOS prompts you to activate iMessage and FaceTime. Always tap Cancel. The consequence of tapping “activate” is that the phone sends an international SMS in the background, costing £0.30 (~¥2.7).
          - paragraph [ref=e516]:
            - strong [ref=e517]: "Q: How do I check my balance?"
          - paragraph [ref=e518]:
            - text: Dial
            - code [ref=e519]: "*100#"
            - text: from the dialer and press call — it displays on screen immediately.
