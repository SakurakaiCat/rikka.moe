          - paragraph [ref=e243]: "Giffgaff numbers have zero monthly fees but are not permanently valid. The terms are clear: if a card has no balance activity for 180 consecutive days, the number is frozen, then deactivated, and the balance is forfeited — unrecoverable."
          - heading "What Counts as Balance Activity" [level=3] [ref=e244]
          - paragraph [ref=e245]: "Valid actions (any one suffices):"
