          - heading "Charged £0.01 (~¥0.09) After Activation?" [level=3] [ref=e202]
          - paragraph [ref=e203]: This is normal. When the SIM first registers on a domestic network, the phone sends a tiny handshake data packet — a few KB of data triggers a charge of 1p (~¥0.09). This only happens once; it won’t recur after you turn off data roaming.
          - separator [ref=e204]
          - heading "4. Four Things to Do Immediately with a New Card" [level=2] [ref=e205]
          - 'heading "First: Disable Voicemail" [level=3] [ref=e206]'
          - paragraph [ref=e207]: Giffgaff has voicemail enabled by default. Calls you don’t answer are automatically forwarded to it and billed at £1/min (~¥9/min) — even if you never listen to the message.
          - paragraph [ref=e208]:
            - strong [ref=e209]: Method 1
            - text: ": Dial"
            - code [ref=e210]: "##002#"
            - text: from the dialer. This is the standard approach, but it often fails while roaming in mainland China, showing “connection error” or “invalid MMI code.”
          - paragraph [ref=e211]:
            - strong [ref=e212]: Method 2
            - text: "(Recommended): Contact customer support. Log in at"
            - link "giffgaff.com/support/ask" [ref=e213] [cursor=pointer]:
              - /url: https://www.giffgaff.com/support/ask
            - text: ", select Category: Account misuse and security issues → Other, and paste this into the description box:"
          - blockquote [ref=e214]:
            - paragraph [ref=e215]: "Hi team, I am unable to disable my voicemail via the code ##002# while roaming. I have tried multiple times but failed. Please assist me in disabling the voicemail feature from the system end to avoid roaming charges. Thank you!"
          - paragraph [ref=e216]: Then click Send to agent. Support typically handles it within 24 hours and notifies you by email. After it’s disabled, test by calling yourself — if you get “number not available,” it worked; if you reach voicemail, it hasn’t been disabled yet.
          - paragraph [ref=e217]:
            - strong [ref=e218]: Method 3
            - text: ": Some users report that"
            - code [ref=e219]: "##002#"
            - text: works when WiFi Calling is enabled, but this only applies when you’re physically in the UK with a valid plan or balance. It essentially doesn’t work in China.
          - 'heading "Second: iPhone Users — Do NOT Activate iMessage and FaceTime" [level=3] [ref=e220]'
          - paragraph [ref=e221]: After inserting the card, iOS will prompt you to activate both. You must tap Cancel. While activation itself is free, the phone sends a silent SMS to UK servers, which costs £0.30 (~¥2.7).
          - 'heading "Third: Turn Off Data Roaming" [level=3] [ref=e222]'
          - paragraph [ref=e223]: Disable data roaming for this card in your phone settings. Roaming data is £200/GB; any background app leaking a little data can cost several pounds in seconds.
