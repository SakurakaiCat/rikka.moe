          - heading "What to Do When You Get a New Phone" [level=3] [ref=e412]
          - paragraph [ref=e413]: "eSIMs can’t be popped out and inserted into another phone like physical cards. The process is the same as the initial conversion: download the giffgaff app on the new phone, log in, Account → SIM → Replace my SIM → Switch to a new eSIM. The old phone’s eSIM automatically deactivates, and the new phone downloads a fresh eSIM profile."
