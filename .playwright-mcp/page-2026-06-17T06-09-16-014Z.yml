          - listitem [ref=e81]: 业余爱好：音乐、二次元和写作
          - listitem [ref=e82]: 最喜欢的地方：我在南宁的小窝（因为在这里有我可以独居的小窝，独处很安静自由，半夜凌晨三点搬椅子到天台看夜空发呆都行），大自然乡下的树林、河流和草原
          - listitem [ref=e83]: 最希望得到的东西：快乐和自由
          - listitem [ref=e84]: 性格：社恐、内向、比较忧郁和焦虑，在意别人的看法、敏感，总是想当「老好人」
