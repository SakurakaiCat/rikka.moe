name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run check

      - name: Build site
        run: npm run build

  sensitive-files-check:
    name: Sensitive Files Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          echo "Checking for potentially sensitive files..."
          
          # Patterns to check
          PATTERNS=(
            '\.env$'
            '\.env\.'
            '\.pem$'
            '\.key$'
            '\.p12$'
            '\.pfx$'
            '\.secret$'
            '\.credentials$'
            'id_rsa'
            'id_ed25519'
            '\.htpasswd'
            '\.netrc'
            '\.npmrc'
            'aws/credentials'
            'kubeconfig'
            '\.sqlite$'
            '\.sql$'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            matches=$(git ls-files | grep -E "$pattern" || true)
            if [ -n "$matches" ]; then
              echo "❌ Found sensitive file pattern: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done
          
          # Check for hardcoded secrets in source files
          echo ""
          echo "Checking for hardcoded secrets in source files..."
          
          # Patterns to avoid (these are variable names, not actual secrets)
          EXCLUDE_PATTERNS='\b(data-website-id| SecretBinding|env\.)\b'
          
          # Check for API keys, tokens, passwords (heuristic)
          if grep -r -n -E '(api[_-]?key|api[_-]?token|password|secret|private[_-]?key)\s*=\s*["\'][^"\']{10,}["\']' \
            --include="*.ts" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" \
            src/ functions/ 2>/dev/null | grep -v -E "$EXCLUDE_PATTERNS"; then
            echo "❌ Potential hardcoded secret found!"
            FOUND=1
          fi
          
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "⚠️  Sensitive files or hardcoded secrets detected!"
            exit 1
          fi
          
          echo "✅ No sensitive files or hardcoded secrets detected."

  check-gitignore:
    name: Check .gitignore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then
            echo "❌ .gitignore file is missing!"
            exit 1
          fi
          
          echo "✅ .gitignore exists"
          
          # Check for common sensitive entries
          REQUIRED_ENTRIES=(
            '.env'
            '.env.*'
            '*.pem'
            '*.key'
            '*.p12'
            '*.pfx'
            '.netrc'
            '*.log'
          )
          
          MISSING=0
          for entry in "${REQUIRED_ENTRIES[@]}"; do
            if ! grep -q "$entry" .gitignore; then
              echo "⚠️  Recommended entry missing in .gitignore: $entry"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "Consider adding the missing entries to .gitignore"
          fi
